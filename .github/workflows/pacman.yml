name: Generate Pacman contribution graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pacman SVGs
        uses: abozanona/pacman-contribution-graph@v2.3.0
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Prepare generated SVGs
        run: |
          mkdir -p dist
          cp pacman-contribution-graph.svg dist/
          cp pacman-contribution-graph-dark.svg dist/

      - name: Publish generated SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
